<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квесты Таркова — что делать и какой ключ нужен</title>
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <header class="topbar">
    <nav id="traders" class="traders" aria-label="Торговцы"></nav>
    <div class="tools">
      <label class="tool level" title="Ваш уровень в игре: квесты выше него считаются заблокированными">Уровень <input id="level" type="number" min="1" max="79" placeholder="—"></label>
      <button id="save" class="tool" type="button">Сохранить</button>
      <button id="kappa-tab" class="tool kappa-tab" type="button"><span>Каппа</span><span class="kcount"></span></button>
      <button id="load" class="tool" type="button">Загрузить</button>
      <details class="menu">
        <summary class="tool">⚙ Настройки</summary>
        <div class="menu-body">
          <label><input type="checkbox" data-filter="event"> Ивентовые квесты</label>
          <label><input type="checkbox" data-filter="arena"> Квесты Arena</label>
          <label><input type="checkbox" data-filter="seasonal"> Сезонные квесты</label>
          <label><input type="checkbox" data-filter="historical"> Устаревшие (удалены из игры)</label>
          <hr>
          <label id="autosave-label" title="Записывать прогресс в выбранный файл после каждого действия с квестами"><input type="checkbox" id="autosave"> Автосохранение в файл</label>
          <button id="forget-file" type="button" hidden>Сменить файл прогресса</button>
          <button id="reset" type="button" class="danger">Сбросить прогресс</button>
        </div>
      </details>
      <a id="donate" class="tool donate" target="_blank" rel="noopener" hidden>♥ Поддержать автора</a>
      <input id="import-file" type="file" accept="application/json" hidden>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="list-filters">
        <button id="show-done" type="button" class="act-btn" aria-pressed="false">Завершённые</button>
        <button id="show-locked" type="button" class="act-btn" aria-pressed="false">Заблокированные</button>
      </div>
      <div class="list-map">
        <select id="map" aria-label="Локация"></select>
        <button id="kit-open" type="button" class="act-btn" title="Ключи и предметы для активных квестов на выбранной локации">Что взять</button>
      </div>
      <div class="list-search"><input id="search" type="search" placeholder="Поиск квеста…" autocomplete="off"></div>
      <div id="list" class="list"></div>
    </aside>
    <section id="detail" class="detail"></section>
  </main>

  <footer class="footer">
    Тексты и изображения — <a href="https://escapefromtarkov.fandom.com/ru/" target="_blank" rel="noopener">Escape from Tarkov Wiki</a> (CC BY-SA).
    Неофициальный фанатский проект, не связан с Battlestate Games. <span id="built"></span>
  </footer>

  <dialog id="kit" class="kit"></dialog>
  <div id="lightbox" class="lightbox" hidden><img alt=""></div>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js?v=22"></script>
  <script src="data/quests.js?v=22"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
